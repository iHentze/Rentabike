# Test, build and deploy the Worker to Cloudflare on every push to the
# branches below (or by hand from the Actions tab).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   "Edit Cloudflare Workers" template + D1:Edit
#   CLOUDFLARE_ACCOUNT_ID  only if the token can see more than one account
#
# Without the token the run still tests and builds; the Cloudflare steps are
# skipped with a warning instead of failing. The Worker lands on
# rentabike.<account>.workers.dev — no custom domain is configured, so this
# never touches rentabike.fo.
name: Deploy

on:
  push:
    branches:
      - main
      - claude/session-overview-tej1se
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Test, build, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy skipped
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN secret is not set — tests and build passed, nothing deployed."

      # No-op until a new file lands in drizzle/; the schema is already live.
      - name: Apply D1 migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply rentabike --remote

      - name: Deploy Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy --var APP_ENV:production
